<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lysandra Admin — Login</title>
<link rel="icon" href="/static/img/icon.png">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body.app-shell { display: block; }
  .login-wrap {
    min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255, 122, 26, 0.12), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(31, 127, 209, 0.12), transparent 45%);
  }
  .login-card {
    width: 360px; max-width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow-md);
    animation: modal-in 0.2s ease-out;
  }
  .login-logo { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
  .login-logo img { width: 56px; height: 56px; border-radius: 14px; box-shadow: var(--shadow-sm); }
  .login-logo span { font-weight: 700; font-size: 20px; background: var(--flame); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .error-box { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 16px; }
  .footer-note { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 18px; }
  @media (max-width: 420px) { .login-card { padding: 20px; } }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="/static/img/icon.png" alt="Lysandra">
      <span>Lysandra Admin</span>
    </div>
    <div class="field">
      <label>Username</label>
      <input id="username" type="text" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn" id="login-btn" style="width:100%;">Log in</button>
    <div class="error-box" id="error-box"></div>
    <div class="footer-note">©️ Copyright by Dr. Dev || Dr. Hamza 2026 All Rights Reserved.</div>
  </div>
</div>
<script src="/static/js/fingerprint.js"></script>
<script>
const btn = document.getElementById("login-btn");
const errBox = document.getElementById("error-box");

async function doLogin() {
  errBox.textContent = "";
  btn.disabled = true;
  btn.textContent = "Logging in...";
  try {
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest" },
      credentials: "include",
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
        fp: computeFingerprint(),
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 423) {
      errBox.textContent = "Too many failed attempts. This device is locked for 24 hours.";
    } else if (!res.ok) {
      errBox.textContent = data.detail || "Login failed.";
    } else {
      window.location.href = "/dashboard";
      return;
    }
  } catch (e) {
    errBox.textContent = "Network error.";
  }
  btn.disabled = false;
  btn.textContent = "Log in";
}

btn.addEventListener("click", doLogin);
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
