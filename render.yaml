services:
  - type: web
    name: lysandraapp
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # ONE worker on purpose: the nonce cache, admin session and config cache live in memory.
    startCommand: gunicorn wsgi:app --worker-class gthread --workers 1 --threads 24 --timeout 90 --graceful-timeout 20 --keep-alive 5 --max-requests 2000 --max-requests-jitter 200 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - {key: FIREBASE_DB_URL, sync: false}
      - {key: APP_SECRET, sync: false}
      - {key: ALLOWED_APK_SHA256, sync: false}
      - {key: ADMIN_USER, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: ADMIN_PATH, value: /lysandra-admin}
      - {key: TELEGRAM_BOT_TOKEN, sync: false}
      - {key: TELEGRAM_ADMIN_CHAT_ID, sync: false}
      - {key: TELEGRAM_WEBHOOK_SECRET, generateValue: true}
      - {key: PUBLIC_URL, value: "https://lysandraapp.onrender.com"}
      - {key: ORIGIN_SECRET, sync: false}
      - {key: YOUTUBE_PROXIES, sync: false}
      - {key: IPINTEL_PROVIDER, value: ipapi_is}
      - {key: PYTHON_VERSION, value: "3.12.8"}
