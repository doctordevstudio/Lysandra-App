<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lysandra Admin — Settings</title>
<link rel="icon" href="/static/img/icon.png">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="main">
  <div class="content">

    <div class="card">
      <h2 style="margin-top:0;">Maintenance mode</h2>
      <div class="field">
        <label><input type="checkbox" id="s-maintenance-mode" style="width:auto; margin-right:6px;"> Enable maintenance mode (blocks app usage, shown to every user on launch)</label>
      </div>
      <div class="field"><label>Maintenance message (text or HTML)</label><textarea id="s-maintenance-message"></textarea></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Ads</h2>
      <div class="field"><label><input type="checkbox" id="s-ads-enabled" style="width:auto; margin-right:6px;"> Ads enabled (master switch)</label></div>
      <div class="grid">
        <div>
          <h3>Start.io</h3>
          <div class="field"><label><input type="checkbox" id="s-startio-enabled" style="width:auto; margin-right:6px;"> Enabled</label></div>
          <div class="field"><label>App ID</label><input id="s-startio-app-id"></div>
          <div class="field"><label>Banner Unit ID</label><input id="s-startio-banner-id"></div>
          <div class="field"><label>Interstitial Unit ID</label><input id="s-startio-interstitial-id"></div>
          <div class="field"><label>Rewarded Unit ID</label><input id="s-startio-rewarded-id"></div>
          <div class="field"><label>Native Unit ID</label><input id="s-startio-native-id"></div>
        </div>
        <div>
          <h3>Monetag</h3>
          <div class="field"><label><input type="checkbox" id="s-monetag-enabled" style="width:auto; margin-right:6px;"> Enabled (fallback / direct-link)</label></div>
          <div class="field"><label>Zone ID</label><input id="s-monetag-zone-id"></div>
          <div class="field"><label>Direct Link URL</label><input id="s-monetag-direct-link"></div>
        </div>
      </div>
      <div class="field" style="margin-top:10px;"><label><input type="checkbox" id="s-carousel-enabled" style="width:auto; margin-right:6px;"> Carousel enabled</label></div>
      <div class="field"><label><input type="checkbox" id="s-dialog-enabled" style="width:auto; margin-right:6px;"> Dialog enabled</label></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Theme</h2>
      <div class="field">
        <label>Default theme for new installs</label>
        <select id="s-theme-default"><option value="light">Day</option><option value="dark">Night</option></select>
      </div>
      <div class="field"><label><input type="checkbox" id="s-theme-toggle" style="width:auto; margin-right:6px;"> Allow users to switch theme in-app</label></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Legal</h2>
      <div class="field"><label>Terms &amp; Conditions (HTML)</label><textarea id="s-terms" style="min-height:140px;"></textarea></div>
      <div class="field"><label>Privacy Policy (HTML)</label><textarea id="s-privacy" style="min-height:140px;"></textarea></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Support &amp; Developer</h2>
      <div class="field"><label>Customer Support Telegram</label><input id="s-support-telegram"></div>
      <div class="field"><label>Developer Telegram</label><input id="s-dev-telegram"></div>
      <div class="field"><label>Developer Name</label><input id="s-dev-name"></div>
      <div class="field"><label>Developer Bio</label><textarea id="s-dev-bio"></textarea></div>
      <div class="field"><label>Developer Image URL</label><input id="s-dev-image"></div>
      <div class="field"><label>Developer Rate / tagline</label><input id="s-dev-rate"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Versioning &amp; Extraction</h2>
      <div class="field"><label>Latest Version Code</label><input id="s-latest-version"></div>
      <div class="field"><label>Update Channel URL (GitHub / Telegram APK link)</label><input id="s-update-url"></div>
      <div class="field"><label>YouTube Proxies (one per line)</label><textarea id="s-proxies"></textarea></div>
    </div>

    <button class="btn" id="save-btn" style="align-self:flex-start;">Save Settings</button>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/settings.js"></script>
</body>
</html>
