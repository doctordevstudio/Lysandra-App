<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lysandra Admin — Notifications</title>
<link rel="icon" href="/static/img/icon.png">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="main">
  <div class="content">
    <div class="toolbar" style="justify-content:space-between;">
      <div id="range-picker"></div>
      <button class="btn" id="new-btn">+ Send Notification</button>
    </div>

    <div class="grid">
      <div class="card stat-card" id="views-card"><div class="label">Total Views</div><div class="value">0</div></div>
      <div class="card stat-card" id="clicks-card"><div class="label">Total Clicks</div><div class="value">0</div></div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Title</th><th>Message</th><th>Views</th><th>Clicks</th><th>Status</th><th>Sent</th><th></th></tr></thead>
        <tbody id="notif-table-body"></tbody>
      </table>
      <div class="load-more" id="list-load-more" style="display:none;"><button class="btn secondary" id="list-load-more-btn">Load more</button></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="form-modal">
  <div class="modal">
    <h2 id="form-title">New Notification</h2>
    <div class="field"><label>Title</label><input id="f-title"></div>
    <div class="field"><label>Message</label><textarea id="f-message"></textarea></div>
    <div class="field"><label>Image URL (optional)</label><input id="f-image"></div>
    <div class="field"><label>On-click URL (optional)</label><input id="f-click"></div>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn secondary" id="form-cancel">Cancel</button>
      <button class="btn" id="form-save">Send</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="viewers-modal">
  <div class="modal">
    <h2 id="viewers-title">Viewers</h2>
    <div class="toolbar" style="margin-bottom:10px;">
      <button class="btn secondary" id="show-viewers" data-which="view">Viewed by</button>
      <button class="btn secondary" id="show-clickers" data-which="click">Clicked by</button>
    </div>
    <table><thead><tr><th>Device</th><th>IP</th><th>Time</th></tr></thead><tbody id="viewers-body"></tbody></table>
    <div class="load-more" id="viewers-load-more" style="display:none;"><button class="btn secondary" id="viewers-load-more-btn">Load more</button></div>
    <div style="text-align:right; margin-top:14px;"><button class="btn secondary" id="viewers-close">Close</button></div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/notifications.js"></script>
</body>
</html>
