services:
  - type: web
    name: lysandra-admin
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_DB_URL
        sync: false
      - key: MAIN_BACKEND_RELOAD_URL
        sync: false
      - key: MAIN_BACKEND_ADMIN_TOKEN
        sync: false
